const car=(items,id)=>`<div class="car rv" data-car="${id}"><div class="tr">${items.map((x,i)=>`<div class="sl"><div style="${BG(i+id,i+id,GR[(i+id)%5])}"><b>${x[0]}</b><span>${x[1]}</span><em>AD</em></div></div>`).join('')}</div><div class="dots">${items.map((_,i)=>'<i'+(i?'':' class="on"')+'></i>').join('')}</div></div>`;
const OFF=[['Diwali Dhamaka','Up to 60% off at local stores'],['Fashion Fest','Min 40% off · Raj Fashion'],['Mobile Mela','10% instant discount'],['Kirana Savers','Free home delivery'],['Furniture Sale','Flat ₹2000 off'],['Beauty Week','Buy 1 Get 1'],['Food Festival','Combo from ₹99'],['Gold Rush','Zero making charges'],['Auto Care','Free checkup'],['Hardware Deals','Bulk discounts']];
const strip=()=>`<section class="rv"><h2>${t('cats')}</h2><div class="ic">${CT.map((c,i)=>`<a href="#shops" data-a="cat" data-i="${i}"><s>${IM[c[0]]}</s>${cn(i)}</a>`).join('')}</div></section>`;
const mkts=()=>`<section class="rv"><h2>${t('tm')}</h2><div class="g4">${MK.map((m,i)=>`<a href="#shops" data-a="mk" data-i="${i}" class="cd" style="padding:14px;text-align:center"><div style="font-size:36px">🏬</div><b>${m}</b><div class="mu">${shops().filter(s=>s.m==i).length} ${t('shops')}</div></a>`).join('')}</div></section>`;
const revs=()=>`<section class="rv"><h2>${t('rev')}</h2><div class="g4">${['Aman','Priya','Rahul','Sana'].map((n,i)=>`<div class="cd" style="padding:14px"><span class="rt">${5-i%2} ★</span><p>“Great service and fair prices!”</p><b>${n}</b></div>`).join('')}</div></section>`;
const faq=()=>`<section class="rv"><h2>${t('faq')}</h2>${['Is listing free?','How do I contact a shop?','Do you deliver?'].map(q=>`<details><summary>${q}</summary><p>Yes — use the Call or WhatsApp buttons on any shop card.</p></details>`).join('')}</section>`;
const cta=()=>`<section class="promo rv"><b>${t('own')}</b><a class="btn" href="#add">${t('add')}</a></section>`;
const hero=(h,p)=>`<div class="hero rv"><a href="#home">Home</a> › <a href="#${p}">${h}</a><h1>${h}</h1></div>`;
const sf=()=>{const f=S.f;return shops().filter(s=>(f.c<0||s.c==f.c)&&(f.m<0||s.m==f.m)&&s.r>=f.r&&(!f.q||s.n.toLowerCase().includes(f.q.toLowerCase()))).sort((a,b)=>f.s=='p'?a.p-b.p:f.s=='r'?b.r-a.r:0)};
const P={home:()=>car(OFF,0)+`<section class="promo rv"><div><b>Big Shopping Utsav</b><div>Up to 70% off from your local markets</div></div><a class="btn" href="#offers">${t('offers')}</a></section>`
+fest(t('pop'),CT.slice(0,4).map((c,i)=>[c[0],cn(i),t('from')+' ₹'+(99+i*50)]))+fest(t('also'),CT.slice(4,8).map((c,i)=>[c[0],cn(i+4),t('off')]))
+`<section class="rv"><h2>${t('spot')}</h2><div class="rel"><div class="sc" id="sc">${shops().slice(0,8).map((s,i)=>`<a href="#shops" class="sp" style="${BG(s.c,s.id,GR[i%5])}"><b>${s.n}</b><small>${t('from')} ₹${s.p}</small></a>`).join('')}</div><button class="arr" aria-label="next" data-a="sc">›</button></div></section>`+strip()
+fest(t('must'),[['📱','Mobiles','Min 50% Off'],['🎧','Audio','Min 50% Off'],['🔋','Power Banks','Min 50% Off'],['⌚','Watches','Min 50% Off']])+car(OFF.slice().reverse(),3)+mkts()
+`<section class="rv"><h2>${t('feat')}</h2><div class="g4">${shops().slice(0,8).map(card).join('')}</div></section>`+revs()+cta()+`<section class="cd rv" style="padding:18px"><h2>${t('news')}</h2><div class="row"><input id="nl" type="email" placeholder="${t('nl')}" aria-label="email"><button class="btn b" data-a="nl">${t('sub')}</button></div></section>`,
shops:()=>{const r=sf(),f=S.f,pp=r.slice(0,S.pgn);return hero(t('shops'),'shops')+`<div class="cf s" style="margin-top:14px"><aside class="cd fl" aria-label="filters"><input id="fq" value="${f.q}" placeholder="${t('search')}"><select id="fc"><option value="-1">${t('all')}</option>${CT.map((c,i)=>`<option value="${i}" ${f.c==i?'selected':''}>${cn(i)}</option>`).join('')}</select><select id="fm"><option value="-1">${t('market')}: ${t('all')}</option>${MK.map((m,i)=>`<option value="${i}" ${f.m==i?'selected':''}>${m}</option>`).join('')}</select><select id="fr"><option value="0">${t('rating')}</option>${[4,4.5].map(v=>`<option ${f.r==v?'selected':''}>${v}</option>`).join('')}</select><select id="fs"><option value="">${t('sort')}</option><option value="p" ${f.s=='p'?'selected':''}>₹ ↑</option><option value="r" ${f.s=='r'?'selected':''}>★ ↓</option></select></aside><div><div class="g4">${pp.map(card).join('')||'—'}</div>${r.length>pp.length?`<p style="text-align:center"><button class="btn b" data-a="more">+</button></p>`:''}</div></div>`+strip()+mkts()+faq()+cta()},
offers:()=>hero(t('offers'),'offers')+`<section class="cd rv" style="padding:16px;margin-top:14px"><b>${t('ends')}</b> <span id="cdn" style="font-size:24px;font-weight:800;color:var(--or)"></span></section><section class="rv"><h2>⚡ Flash Sale</h2><div class="sc">${shops().slice(0,8).map(s=>`<div class="cd sh"><div class="imw"><div class="im">${PIC(s.c,s.id)}</div></div><b>${s.n}</b><div class="of">${s.o+20}% off</div></div>`).join('')}</div></section><section class="rv"><h2>🎟️ Coupons</h2><div class="g4">${['DIWALI50','LOCAL100','FIRST25','BAZAAR10'].map(c=>`<div class="cp"><b>${c}</b><button class="btn o" data-a="cp" data-i="${c}">${t('copy')}</button></div>`).join('')}</div></section><section class="promo rv"><b>HDFC Bank · 10% Instant Discount</b></section><section class="rv"><h2>⭐ Top rated</h2><div class="g4">${shops().filter(s=>s.r>=4.5).slice(0,4).map(card).join('')}</div></section>`+faq()+cta(),
markets:()=>hero(t('markets'),'markets')+`<div class="cd rv" style="padding:14px;margin-top:14px"><input placeholder="${t('pin')}" inputmode="numeric" aria-label="pincode"></div>`+mkts()+`<section class="cd rv" style="padding:14px"><h2>📍 Map</h2><div class="im" style="height:200px">🗺️</div></section><section class="rv"><h2>${t('timing')}</h2><div style="overflow-x:auto"><table>${MK.map(m=>`<tr><td>${m}</td><td>10:00 – 21:00</td><td>Mon–Sat</td></tr>`).join('')}</table></div></section>`+revs()+cta(),
add:()=>hero(t('add'),'add')+`<section class="g4 rv" style="margin-top:14px">${['🆓 Free listing','📞 Direct calls','💬 WhatsApp leads','📈 More customers'].map(b=>`<div class="cd" style="padding:16px;text-align:center"><b>${b}</b></div>`).join('')}</section><section class="g4 rv">${[['Free','₹0'],['Silver','₹499/mo'],['Gold','₹999/mo']].map(p=>`<div class="cd" style="padding:16px;text-align:center"><h2>${p[0]}</h2><b style="font-size:24px">${p[1]}</b></div>`).join('')}</section><section class="cf rv" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><form id="af" class="cd fl" style="position:static"><h2>${t('add')}</h2><input name="n" placeholder="${t('name')}"><input name="o" placeholder="${t('owner')}"><input name="ph" placeholder="${t('phone')}" inputmode="tel"><select name="c">${CT.map((c,i)=>`<option value="${i}">${cn(i)}</option>`).join('')}</select><select name="m">${MK.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select><input name="a" placeholder="${t('addr')}"><textarea name="d" placeholder="${t('desc')}"></textarea><input type="file" accept="image/*" aria-label="image"><button class="btn">${t('save')}</button></form><form id="cf" class="cd fl" style="position:static"><h2>${t('contact')}</h2><div>📞 ${PH}</div><input name="n" placeholder="${t('name')}"><textarea name="m" placeholder="${t('msg')}"></textarea><button class="btn b">${t('save')}</button></form></section>`+faq()};
function render(){const p=S.pg,d=document.documentElement;d.lang=S.lang;d.dir=S.lang=='ur'?'rtl':'ltr';
$('#app').innerHTML=`<div class="top"><div class="w"><span>📍 <select id="pin"><option>${t('market')}: ${MK[0]}</option>${MK.slice(1).map(m=>`<option>${m}</option>`).join('')}</select></span><span>📞 ${PH}</span><span style="margin-inline-start:auto">🌐 <select id="lang" aria-label="Language">${Object.keys(LN).map(k=>`<option value="${k}" ${k==S.lang?'selected':''}>${LN[k]}</option>`).join('')}</select></span></div></div><header><div class="w"><div class="hd"><a class="logo" href="#home">Apna<b>Bazaar</b></a><a class="pill hm ${p=='markets'?'on':''}" href="#markets">${t('markets')}</a><a class="pill hm" href="#shops">${t('delivery')}</a><a class="pill hm" href="#add">${t('services')}</a><div class="sr"><input id="q" placeholder="${t('search')}" autocomplete="off" aria-label="search"><div class="sg" id="sg" hidden></div></div><div class="ac"><span class="lg"><button class="pill" data-a="login">👤 ${t('login')}</button><span class="tip">${t('login')}</span></span><a class="pill hm" href="#offers">${t('more')} ▾</a><a class="pill" href="#shops" data-a="wl" aria-label="wishlist">❤️ ${S.w.length}</a><span class="pill">🛒 ${S.cart}</span></div></div><nav class="nv"><a class="${p=='home'?'on':''}" href="#home">${t('home')}</a>${CT.map((c,i)=>`<a href="#shops" data-a="cat" data-i="${i}">${cn(i)}</a>`).join('')}</nav></div></header><main class="w" id="main">${P[p]()}</main><footer><div class="w"><div class="g4"><div><h4>Apna Bazaar</h4><a href="#home">About</a><a href="#add">${t('contact')}</a></div><div><h4>${t('shops')}</h4><a href="#shops">${t('all')}</a><a href="#markets">${t('markets')}</a></div><div><h4>${t('offers')}</h4><a href="#offers">${t('copy')}</a></div><div><h4>Social</h4>📘 📸 🐦 ▶️<br>📱 App Store · Play Store</div></div><p>💳 UPI · Visa · Mastercard · RuPay<br>© 2026 Apna Bazaar</p></div></footer><div class="fabs"><a class="fab" style="background:#2874F0" href="tel:${PH}" aria-label="Call">${PHI}</a><a class="fab" style="background:#25D366" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('Hello Apna Bazaar!')}" aria-label="WhatsApp">${WAI}</a></div>`;
document.title='Apna Bazaar – '+p;initFx()}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}
let timers=[];function initFx(){timers.forEach(clearInterval);timers=[];const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.05});document.querySelectorAll('.rv').forEach(e=>io.observe(e));
document.querySelectorAll('[data-car]').forEach(c=>{let i=0;const tr=c.firstChild,n=tr.children.length,dots=c.querySelectorAll('i');timers.push(setInterval(()=>{const v=innerWidth>=768?3:1;i=(i+1)%(n-v+1);tr.style.transform=`translateX(${(S.lang=='ur'?1:-1)*i*100/v}%)`;dots.forEach((d,j)=>d.classList.toggle('on',j==i))},3500))});
const cd=$('#cdn');if(cd){const end=Date.now()+864e5*2;const u=()=>{let s=Math.max(0,(end-Date.now())/1e3|0);cd.textContent=[s/3600|0,s/60%60|0,s%60].map(x=>String(x|0).padStart(2,'0')).join(':')};u();timers.push(setInterval(u,1e3))}}
function route(){S.pg=(location.hash.slice(1)||'home');if(!P[S.pg])S.pg='home';S.pgn=12;render();scrollTo(0,0)}
addEventListener('hashchange',route);
addEventListener('scroll',()=>$('#bt').style.display=scrollY>400?'block':'none');
document.addEventListener('change',e=>{const i=e.target.id,f=S.f;if(i=='lang'){S.lang=e.target.value;localStorage.l=S.lang;render()}else if(i=='fc'){f.c=+e.target.value;render()}else if(i=='fm'){f.m=+e.target.value;render()}else if(i=='fr'){f.r=+e.target.value||0;render()}else if(i=='fs'){f.s=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id=='fq'){S.f.q=e.target.value;const p=e.target.selectionStart;render();const x=$('#fq');x.focus();x.setSelectionRange(p,p)}
if(e.target.id=='q'){const v=e.target.value.toLowerCase(),g=$('#sg'),r=v?shops().filter(s=>s.n.toLowerCase().includes(v)).slice(0,6):[];g.hidden=!r.length;g.innerHTML=r.map(s=>`<a href="#shops" data-a="sq" data-i="${s.n}">${CT[s.c][0]} ${s.n}</a>`).join('')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
if(f.id=='af'){if(!d.n||!d.o||!d.ph||!d.a)return toast(t('req'));S.my.push({id:100+S.my.length,n:d.n,c:+d.c,m:+d.m,r:4,rv:0,p:299,o:15,open:true,ph:d.ph});localStorage.my=JSON.stringify(S.my);toast(t('done'));location.hash='shops'}
else if(f.id=='cf'){if(!d.n||!d.m)return toast(t('req'));toast('✔');f.reset()}else if(f.id=='lf'){toast('✔ '+t('login'));$('#dl').close()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!e.target.closest('.sr'))$('#sg')&&($('#sg').hidden=true);if(!el)return;const a=el.dataset.a,i=el.dataset.i;
if(a=='w'){const k=+i;S.w=S.w.includes(k)?S.w.filter(x=>x!=k):S.w.concat(k);localStorage.w=JSON.stringify(S.w);render()}
else if(a=='cat'){S.f={c:+i,m:-1,r:0,q:'',s:''};if(location.hash=='#shops')render()}
else if(a=='mk'){S.f={c:-1,m:+i,r:0,q:'',s:''};if(location.hash=='#shops')render()}
else if(a=='sq'){S.f={c:-1,m:-1,r:0,q:i,s:''};if(location.hash=='#shops')render()}
else if(a=='more'){S.pgn+=12;render()}else if(a=='sc'){$('#sc').scrollBy({left:420,behavior:'smooth'})}
else if(a=='cp'){navigator.clipboard&&navigator.clipboard.writeText(i).catch(()=>{});toast(i+' ✔')}
else if(a=='nl'){const v=$('#nl').value;toast(/\S+@\S+/.test(v)?'✔':t('req'))}
else if(a=='login'){const d=$('#dl');d.innerHTML=`<form id="lf"><h2>${t('login')}</h2><input type="email" placeholder="Email" required style="margin:6px 0"><input type="password" placeholder="Password" required><p><button class="btn b" style="width:100%">${t('login')}</button></p></form>`;d.showModal()}});
route();
</script></body></html>
